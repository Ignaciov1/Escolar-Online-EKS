apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: escolaronline
  labels:
    app: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: 314870398011.dkr.ecr.us-east-1.amazonaws.com/escolaronline-frontend:latest
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 250m
            memory: 256Mi
