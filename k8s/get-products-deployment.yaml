apiVersion: apps/v1
kind: Deployment
metadata:
  name: get-products
  namespace: escolaronline
  labels:
    app: get-products
spec:
  replicas: 2
  selector:
    matchLabels:
      app: get-products
  template:
    metadata:
      labels:
        app: get-products
    spec:
      containers:
      - name: get-products
        image: 314870398011.dkr.ecr.us-east-1.amazonaws.com/escolaronline-get-products:latest
        ports:
        - containerPort: 3001
        env:
        - name: PORT
          value: "3001"
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: escolaronline-config
              key: DB_HOST
        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              name: escolaronline-config
              key: DB_NAME
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: escolaronline-config
              key: DB_PORT
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: escolaronline-secret
              key: DB_USER
        - name: DB_PASS
          valueFrom:
            secretKeyRef:
              name: escolaronline-secret
              key: DB_PASS
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 250m
            memory: 256Mi
