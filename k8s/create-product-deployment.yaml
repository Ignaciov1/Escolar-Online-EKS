apiVersion: apps/v1
kind: Deployment
metadata:
  name: create-product
  namespace: freshbox
  labels:
    app: create-product
spec:
  replicas: 2
  selector:
    matchLabels:
      app: create-product
  template:
    metadata:
      labels:
        app: create-product
    spec:
      containers:
      - name: create-product
        image: 314870398011.dkr.ecr.us-east-1.amazonaws.com/freshbox-create-product:latest
        ports:
        - containerPort: 3002
        env:
        - name: PORT
          value: "3002"
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: freshbox-config
              key: DB_HOST
        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              name: freshbox-config
              key: DB_NAME
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: freshbox-config
              key: DB_PORT
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: freshbox-secret
              key: DB_USER
        - name: DB_PASS
          valueFrom:
            secretKeyRef:
              name: freshbox-secret
              key: DB_PASS
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 250m
            memory: 256Mi
