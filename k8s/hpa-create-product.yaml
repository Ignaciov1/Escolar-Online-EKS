apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: create-product-hpa
  namespace: escolaronline
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: create-product
  minReplicas: 2
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
